{% extends 'products/base.html' %}

{% block content %}

<div class="auth-page">

    <div class="auth-card">

        <h2>Create Account</h2>

        <p class="auth-subtitle">
            Create an account to manage your orders.
        </p>

        <form method="POST">
            {% csrf_token %}

            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                name="username"
                required
            >

            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                name="email"
                required
            >

            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                required
            >

            <button type="submit">
                Create Account
            </button>

        </form>

    </div>

</div>

{% endblock %}
